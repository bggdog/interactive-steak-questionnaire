<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>Responses · An Evening Well Spent</title>
  <style>
    :root {
      --bg: #0a0a0a;
      --card: rgba(12, 12, 12, 0.92);
      --border: rgba(255, 255, 255, 0.12);
      --text: #f4f2ed;
      --muted: #a8a0a0;
      --err: #ff8a8a;
    }
    * { box-sizing: border-box; }
    body {
      margin: 0;
      min-height: 100vh;
      font-family: "Inter", "Segoe UI", system-ui, sans-serif;
      background: var(--bg);
      color: var(--text);
      padding: 24px 16px 48px;
    }
    .wrap {
      max-width: 1000px;
      margin: 0 auto;
    }
    h1 {
      font-size: 1.35rem;
      font-weight: 600;
      margin: 0 0 6px;
    }
    .sub {
      color: var(--muted);
      font-size: 0.9rem;
      margin: 0 0 22px;
    }
    .card {
      background: var(--card);
      border: 1px solid var(--border);
      border-radius: 16px;
      padding: 22px;
      margin-bottom: 18px;
    }
    .grid {
      display: grid;
      gap: 14px;
      grid-template-columns: repeat(auto-fit, minmax(240px, 1fr));
    }
    .stat {
      border: 1px solid var(--border);
      border-radius: 12px;
      padding: 12px;
      background: rgba(0, 0, 0, 0.22);
    }
    .stat-label {
      color: var(--muted);
      font-size: 0.8rem;
      margin-bottom: 6px;
    }
    .stat-value {
      font-size: 1.2rem;
      font-weight: 600;
    }
    .row-actions {
      display: flex;
      flex-wrap: wrap;
      gap: 10px;
      align-items: center;
      margin-top: 4px;
    }
    button {
      font: inherit;
      cursor: pointer;
      border-radius: 10px;
      padding: 10px 18px;
      border: 1px solid rgba(196, 92, 92, 0.45);
      background: linear-gradient(120deg, #8f3535, #c45c5c);
      color: #fff;
      font-weight: 600;
    }
    button.secondary {
      background: rgba(255, 255, 255, 0.06);
      border-color: var(--border);
      color: var(--text);
      font-weight: 500;
    }
    .banner {
      padding: 12px 14px;
      border-radius: 10px;
      margin-bottom: 16px;
      font-size: 0.9rem;
      display: none;
    }
    .banner.show { display: block; }
    .banner.err {
      background: rgba(120, 40, 40, 0.35);
      border: 1px solid rgba(255, 138, 138, 0.35);
      color: var(--err);
    }
    .empty {
      color: var(--muted);
      font-size: 0.95rem;
    }
    .tally-block {
      border: 1px solid var(--border);
      border-radius: 12px;
      padding: 12px;
      margin-bottom: 10px;
      background: rgba(0, 0, 0, 0.22);
    }
    .tally-title {
      font-size: 0.95rem;
      margin: 0 0 10px;
      color: #f1ecec;
    }
    .tally-row {
      display: flex;
      justify-content: space-between;
      gap: 14px;
      padding: 4px 0;
      border-top: 1px solid rgba(255, 255, 255, 0.06);
      font-size: 0.88rem;
    }
    .tally-row:first-of-type { border-top: 0; }
    .tally-key {
      color: #e6dfdf;
      word-break: break-word;
    }
    .tally-count {
      color: #fff;
      font-weight: 600;
      white-space: nowrap;
    }
    .submission {
      border: 1px solid var(--border);
      border-radius: 12px;
      padding: 12px;
      margin-bottom: 10px;
      background: rgba(0, 0, 0, 0.22);
    }
    .submission-meta {
      font-size: 0.82rem;
      color: var(--muted);
      margin-bottom: 6px;
    }
    .submission-name {
      font-size: 1rem;
      margin-bottom: 8px;
    }
    .submission pre {
      margin: 0;
      white-space: pre-wrap;
      word-break: break-word;
      font-size: 0.8rem;
      line-height: 1.45;
      color: #e8e4e4;
    }
  </style>
</head>
<body>
  <div class="wrap">
    <h1>Questionnaire responses</h1>
    <p class="sub">Public portal view with tally summaries and recent submissions.</p>

    <div id="banner" class="banner err" role="status"></div>

    <div class="card">
      <div class="row-actions" style="margin-bottom: 12px;">
        <button type="button" id="refreshBtn" class="secondary">Refresh</button>
      </div>
      <div class="grid" id="statsGrid"></div>
    </div>

    <div class="card">
      <h2 class="tally-title">Tallies by question</h2>
      <div id="tallies"></div>
    </div>

    <div class="card">
      <h2 class="tally-title">Recent submissions</h2>
      <div id="submissions"></div>
    </div>
  </div>

  <script src="/config.js"></script>
  <script type="module">
    const QUESTION_LABELS = {
      guest_name: "Name",
      steak: "How do you like your steak?",
      sushi_preferences: "Any sushi items preferred/excluded?",
      spice_level: "Spice level for the evening",
      cocktail_style: "Cocktail preference",
      favorite_bourbon: "Favorite bourbon or whiskey",
      cigar_experience: "Experience with cigars",
      favorite_cigars: "Favorite cigars",
      conversation_vibe: "Conversational vibe",
      anything_else: "Anything else"
    };

    const banner = document.getElementById("banner");
    const statsGrid = document.getElementById("statsGrid");
    const talliesEl = document.getElementById("tallies");
    const submissionsEl = document.getElementById("submissions");

    function showBanner(text) {
      banner.className = "banner show err";
      banner.textContent = text;
    }

    function hideBanner() {
      banner.className = "banner";
      banner.textContent = "";
    }

    function escapeHtml(s) {
      return String(s)
        .replace(/&/g, "&amp;")
        .replace(/</g, "&lt;")
        .replace(/>/g, "&gt;")
        .replace(/"/g, "&quot;");
    }

    function normalizeAnswer(value) {
      if (value === null || value === undefined) return "(blank)";
      const text = typeof value === "string" ? value.trim() : String(value);
      return text || "(blank)";
    }

    function renderStats(rows) {
      const total = rows.length;
      const named = rows.filter((r) => normalizeAnswer(r.answers?.guest_name) !== "(blank)").length;
      const latest = rows[0]?.created_at ? new Date(rows[0].created_at).toLocaleString() : "n/a";

      statsGrid.innerHTML = "";
      const stats = [
        ["Total submissions", String(total)],
        ["Submissions with name", String(named)],
        ["Most recent submission", latest]
      ];

      for (const [label, value] of stats) {
        const item = document.createElement("div");
        item.className = "stat";
        item.innerHTML =
          "<div class=\"stat-label\">" + escapeHtml(label) + "</div>" +
          "<div class=\"stat-value\">" + escapeHtml(value) + "</div>";
        statsGrid.appendChild(item);
      }
    }

    function buildTallies(rows) {
      const tallyMap = new Map();
      for (const row of rows) {
        const answers = row.answers || {};
        for (const [questionId, rawValue] of Object.entries(answers)) {
          if (!tallyMap.has(questionId)) tallyMap.set(questionId, new Map());
          const value = normalizeAnswer(rawValue);
          const counts = tallyMap.get(questionId);
          counts.set(value, (counts.get(value) || 0) + 1);
        }
      }
      return tallyMap;
    }

    function renderTallies(rows) {
      const tallyMap = buildTallies(rows);
      talliesEl.innerHTML = "";

      if (!rows.length) {
        talliesEl.innerHTML = "<p class=\"empty\">No submissions yet.</p>";
        return;
      }

      for (const [questionId, counts] of tallyMap.entries()) {
        const block = document.createElement("div");
        block.className = "tally-block";
        const title = document.createElement("h3");
        title.className = "tally-title";
        title.textContent = QUESTION_LABELS[questionId] || questionId;
        block.appendChild(title);

        const sorted = [...counts.entries()].sort((a, b) => b[1] - a[1]);
        for (const [value, count] of sorted) {
          const row = document.createElement("div");
          row.className = "tally-row";
          row.innerHTML =
            "<span class=\"tally-key\">" + escapeHtml(value) + "</span>" +
            "<span class=\"tally-count\">" + count + "</span>";
          block.appendChild(row);
        }
        talliesEl.appendChild(block);
      }
    }

    function renderRecent(rows) {
      submissionsEl.innerHTML = "";
      if (!rows.length) {
        submissionsEl.innerHTML = "<p class=\"empty\">No submissions yet.</p>";
        return;
      }
      const recent = rows.slice(0, 10);
      for (const row of recent) {
        const name = normalizeAnswer(row.answers?.guest_name);
        const when = new Date(row.created_at).toLocaleString();
        const item = document.createElement("div");
        item.className = "submission";
        item.innerHTML =
          "<div class=\"submission-name\">" + escapeHtml(name) + "</div>" +
          "<div class=\"submission-meta\">" + escapeHtml(when) + "</div>" +
          "<pre>" + escapeHtml(JSON.stringify(row.answers || {}, null, 2)) + "</pre>";
        submissionsEl.appendChild(item);
      }
    }

    const cfg = window.SUPABASE_CONFIG;
    if (!cfg?.url || !cfg?.anonKey) {
      showBanner("Add your Supabase url and anonKey in config.js, then redeploy.");
    } else {
      const { createClient } = await import("https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2/+esm");
      const supabase = createClient(cfg.url, cfg.anonKey);

      async function loadDashboard() {
        hideBanner();
        talliesEl.innerHTML = "<p class=\"empty\">Loading…</p>";
        submissionsEl.innerHTML = "";
        const { data, error } = await supabase
          .from("questionnaire_submissions")
          .select("id, created_at, answers")
          .order("created_at", { ascending: false });

        if (error) {
          talliesEl.innerHTML = "";
          showBanner(error.message);
          return;
        }

        const rows = data || [];
        renderStats(rows);
        renderTallies(rows);
        renderRecent(rows);
      }

      document.getElementById("refreshBtn").addEventListener("click", () => {
        void loadDashboard();
      });

      await loadDashboard();
    }
  </script>
</body>
</html>
